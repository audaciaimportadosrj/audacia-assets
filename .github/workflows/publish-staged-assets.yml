name: Publish staged assets

on:
  push:
    branches: [main]
    paths:
      - ".asset-staging/READY"

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message != 'Publish Audacia binary assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode staged media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p brand hero
          cat .asset-staging/logo.part* | base64 --decode > brand/logo-gold-v1.webp
          cat .asset-staging/hero.part* | base64 --decode > hero/perfumes-palacio-v1.webp
          file brand/logo-gold-v1.webp hero/perfumes-palacio-v1.webp
          rm -rf .asset-staging
      - name: Commit published assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/logo-gold-v1.webp hero/perfumes-palacio-v1.webp .asset-staging
          git commit -m "Publish Audacia binary assets"
          git push
